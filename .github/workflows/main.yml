name: Compilar Port PS Vita
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    container: vitasdk/vitasdk:latest
    steps:
    - name: Obtener codigo del repositorio
      uses: actions/checkout@v4

    - name: Instalar herramienta zip de respaldo
      run: apk add --no-cache zip

    - name: Compilar ejecutable binario para PS Vita
      run: |
        arm-vita-eabi-g++ main.cpp -o main.elf -lSceCtrl_stub -lSceDisplay_stub
        vita-elf-create main.elf main.velf
        vita-make-fself main.velf eboot.bin
        vita-mksfoex -s TITLE_ID=ZOMBIE001 "Zombie Attack Port" param.sfo

    - name: Empaquetar VPK final
      run: |
        zip -r ZombieAttackVita.vpk eboot.bin param.sfo

    - name: Subir archivo para descargar
      uses: actions/upload-artifact@v4
      with:
        name: Bubble-PSVita
        path: ZombieAttackVita.vpk
